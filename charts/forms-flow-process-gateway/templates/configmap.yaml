{{- if (include "forms-flow-process-gateway.createConfigmap" .) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: forms-flow-process-gateway
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  PYTHONUNBUFFERED: {{ .Values.gateway.pythonUnbuffered | default "1" | quote }}
  FASTAPI_ENV: {{ .Values.gateway.fastapiEnv | default "production" | quote }}
  FORMSFLOW_PROCESS_GATEWAY_WORKERS: {{ .Values.gateway.workers | default "1" | quote }}
  FORWARDED_ALLOW_IPS: {{ .Values.gateway.forwardedAllowIps | default "*" | quote }}
  LOG_LEVEL: {{ .Values.gateway.logLevel | default "INFO" | quote }}
  ENGINE_CONFIG_FILE: {{ .Values.gateway.engineConfigFile | default "/app/config/gateway_config.yaml" | quote }}
  CAMUNDA_URL_PREFIX: {{ .Values.gateway.camundaUrlPrefix | default "/engine-rest-ext/v1" | quote }}
  BPM_CLIENT_ID: {{ .Values.gateway.bpmClientId | default "forms-flow-bpm" | quote }}
  KEYCLOAK_BPM_CLIENT_ID: {{ .Values.gateway.keycloakBpmClientId | default "forms-flow-bpm" | quote }}
  GATEWAY_ADAPTERS: {{ .Values.gateway.gatewayAdapters | default "camunda" | quote }}
  OFFLINE_ON_BEHALF_LEEWAY_S: {{ .Values.gateway.offlineOnBehalfLeewayS | default "30" | quote }}
  OFFLINE_WORKER_CLIENT_ID: {{ .Values.gateway.offlineWorkerClientId | default "forms-flow-offline-worker" | quote }}
  OFFLINE_WORKER_PUBLIC_KEY: {{ .Values.gateway.offlineWorkerPublicKey | quote }}
  OFFLINE_REPLAY_REDIS_URL: {{ .Values.gateway.offlineReplayRedisUrl | default "redis://redis-exporter:6379/2" | quote }}
  {{- if .Values.configuration }}
  {{- include "common.tplvalues.render" (dict "value" .Values.configuration "context" $) | nindent 2 }}
  {{- end }}
{{- end }}
