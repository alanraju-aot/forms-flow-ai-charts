{{- if and .Values.mongodb .Values.mongodb.enabled }}
{{- $clusterName := .Values.mongodb.name | default "forms-flow-mongodb" -}}
{{- $secretName := default (printf "%s-user-secret" $clusterName) .Values.mongodb.auth.existingSecretName -}}
{{- if not .Values.mongodb.auth.existingSecretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: mongodb-community
type: Opaque
stringData:
  password: {{ .Values.mongodb.auth.password | default "changeme" | quote }}
---
{{- end }}
apiVersion: mongodb.mongodb.com/v1
kind: mongodb
metadata:
  name: {{ $clusterName }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: mongodb-community
spec:
  members: {{ .Values.mongodb.members | default 3 }}
  type: {{ .Values.mongodb.type | default "ReplicaSet" }}
  version: {{ .Values.mongodb.version | default "7.0.14" | quote }}
  security:
    authentication:
      modes:
        - SCRAM
  users:
    - name: {{ .Values.mongodb.auth.username | default "mongodb" | quote }}
      db: {{ .Values.mongodb.auth.authSource | default "admin" | quote }}
      passwordSecretRef:
        name: {{ $secretName }}
        key: {{ .Values.mongodb.auth.existingSecretKey | default "password" }}
      scramCredentialsSecretName: {{ printf "%s-%s-scram" $clusterName (.Values.mongodb.auth.username | default "mongodb") }}
      roles:
        - name: readWriteAnyDatabase
          db: admin
        - name: dbAdminAnyDatabase
          db: admin
        - name: userAdminAnyDatabase
          db: admin
        - name: clusterAdmin
          db: admin
  statefulSet:
    spec:
      template:
        spec:
          {{- if and .Values.mongodb.customImage .Values.mongodb.customImage.enabled .Values.mongodb.customImage.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml .Values.mongodb.customImage.imagePullSecrets | nindent 12 }}
          {{- else if .Values.imageCredentials }}
          imagePullSecrets:
            - name: {{ printf "%s-auth" (include "common.names.fullname" .) | trunc 63 | trimSuffix "-" }}
          {{- end }}
          containers:
            - name: mongod
              {{- if and .Values.mongodb.customImage .Values.mongodb.customImage.enabled .Values.mongodb.customImage.image }}
              image: {{ .Values.mongodb.customImage.image | quote }}
              {{- end }}
              {{- if .Values.mongodb.resources }}
              resources:
                {{- toYaml .Values.mongodb.resources | nindent 16 }}
              {{- end }}
      volumeClaimTemplates:
        - metadata:
            name: data-volume
          spec:
            accessModes:
              - ReadWriteOnce
            {{- if .Values.mongodb.storage.storageClassName }}
            storageClassName: {{ .Values.mongodb.storage.storageClassName | quote }}
            {{- end }}
            resources:
              requests:
                storage: {{ .Values.mongodb.storage.size | default "8Gi" | quote }}
        - metadata:
            name: logs-volume
          spec:
            accessModes:
              - ReadWriteOnce
            {{- if .Values.mongodb.storage.storageClassName }}
            storageClassName: {{ .Values.mongodb.storage.storageClassName | quote }}
            {{- end }}
            resources:
              requests:
                storage: {{ .Values.mongodb.storage.logsSize | default "4Gi" | quote }}
{{- end }}
