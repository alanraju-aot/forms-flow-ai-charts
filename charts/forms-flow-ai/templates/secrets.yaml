apiVersion: v1
kind: Secret
metadata:
  labels:
    app: "{{ .Chart.Name }}"
  name: "{{ .Chart.Name }}"
stringData:
  FORMIO_ROOT_EMAIL: {{ index .Values "forms-flow-forms" "admin" "email" }}
  FORMIO_ROOT_PASSWORD: {{ index .Values "forms-flow-forms" "admin" "password" }}
  FORMIO_JWT_SECRET: "{{ .Release.Namespace }}-jwt-secret" 
  KEYCLOAK_CLIENTID: {{ index .Values "forms-flow-bpm" "clientid" }}
  KEYCLOAK_CLIENTSECRET: {{ index .Values "forms-flow-bpm" "clientsecret" }}
  WEB_CLIENTID: {{ index .Values "forms-flow-web" "clientid" }}
  WEBSOCKET_ENCRYPT_KEY: "{{ .Values.websocket_encrypt_key }}"
  ADMIN_WEB_CLIENTID: {{ index .Values "forms-flow-web" "clientid" }}
  INSIGHT_API_KEY:  "{{ .Values.insight_api_key }}"
  REDIS_PASSCODE: "{{ .Values.redis_pass_code }}"
  IPAAS_EMBEDDED_API_KEY: "{{ .Values.ipaas.embedded_api_key }}"
  IPAAS_JWT_PRIVATE_KEY: "{{ .Values.ipaas.jwt_private_key }}"
  {{- if and .Values.mongodbCommunity .Values.mongodbCommunity.enabled }}
  FORMIO_DB_NAME: {{ .Values.mongodbCommunity.auth.database | default "formsflow" | quote }}
  {{- $user := .Values.mongodbCommunity.auth.username | default "mongodb" }}
  {{- $pass := .Values.mongodbCommunity.auth.password | default "changeme" }}
  {{- $db := .Values.mongodbCommunity.auth.database | default "formsflow" }}
  {{- $port := .Values.mongodbCommunity.port | default 27017 }}
  {{- $authSource := .Values.mongodbCommunity.auth.authSource | default "admin" }}
  {{- $clusterName := .Values.mongodbCommunity.name | default "forms-flow-mongodb" }}
  {{- $domain := .Values.clusterDomain | default "cluster.local" }}
  {{- $members := int (.Values.mongodbCommunity.members | default 3) }}
  {{- if and .Values.mongodbCommunity.customUri }}
  MONGODB_URI: {{ .Values.mongodbCommunity.customUri | quote }}
  NODE_CONFIG: '{"mongo":"{{ .Values.mongodbCommunity.customUri }}"}'
  {{- else if gt $members 1 }}
  {{- $hosts := list }}
  {{- range $i := until $members }}
    {{- $hosts = append $hosts (printf "%s-%d.%s-svc.%s.svc.%s:%v" $clusterName $i $clusterName $.Release.Namespace $domain $port) }}
  {{- end }}
  {{- $hostList := join "," $hosts }}
  {{- $mongoUri := printf "mongodb://%s:%s@%s/%s?replicaSet=%s&authSource=%s" $user $pass $hostList $db $clusterName $authSource }}
  MONGODB_URI: {{ $mongoUri | quote }}
  NODE_CONFIG: '{"mongo":"{{ $mongoUri }}"}'
  {{- else }}
  {{- $mongoHost := printf "%s-svc.%s.svc.%s:%v" $clusterName $.Release.Namespace $domain $port }}
  {{- $mongoUri := printf "mongodb://%s:%s@%s/%s?authSource=%s" $user $pass $mongoHost $db $authSource }}
  MONGODB_URI: {{ $mongoUri | quote }}
  NODE_CONFIG: '{"mongo":"{{ $mongoUri }}"}'
  {{- end }}
  {{- else }}
  FORMIO_DB_NAME: {{ default "formsflow" (dig "mongodbCommunity" "auth" "database" "formsflow" .Values) | quote }}
  {{- $customUri := dig "mongodbCommunity" "customUri" "" .Values }}
  MONGODB_URI: {{ $customUri | quote }}
  NODE_CONFIG: '{"mongo":"{{ $customUri }}"}'
  {{- end }}
  OPENAI_API_KEY: {{ .Values.openai.apiKey }}