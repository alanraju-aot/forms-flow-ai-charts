apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.names.fullname" . }}-nginx-config
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: forms-flow-ai-assistant
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  nginx.conf: |
    events {
      worker_connections 1024;
    }

    http {
      server {
        client_max_body_size {{ .Values.maxSizePayload }};
        listen {{ .Values.ingress.servicePort }};

        location = /assistant {
          return 301 /assistant/;
        }

        location /assistant/ {
          proxy_set_header Host $http_host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_set_header X-Forwarded-Prefix /assistant;
          proxy_set_header SCRIPT_NAME /assistant;

          proxy_connect_timeout 60s;
          proxy_send_timeout 120s;
          proxy_read_timeout 120s;

          proxy_http_version 1.1;
          proxy_set_header Connection "";

          proxy_pass http://127.0.0.1:{{ .Values.containerPorts.http }};
        }
      }
    }

    pid /tmp/nginx.pid;
